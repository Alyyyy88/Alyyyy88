name: Generate Pacman graph
on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: jvherk/pacman-graph@v1
        with:
          username: ${{ github.repository_owner }}
          output_file: output/pacman-contribution-graph.svg
