name: Generate Pacman graph
on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: P-Pacman/Pacman-Graph-Action@v1
        with:
          username: Alyyyy88
          output_file: output/pacman-contribution-graph.svg
